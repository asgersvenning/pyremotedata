name: Rebuild and Publish to PyPI

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    # 1. Set the environment name to match your PyPI Trusted Publisher config
    environment:
      name: pypi 

    # 2. Grant OIDC permissions for passwordless publishing and issue/contents updates
    permissions:
      id-token: write   # MANDATORY: Allows uv to authenticate with PyPI
      contents: write   # MANDATORY: Allows the bot to push the version commit and force tag
      pages: write      # OPTIONAL: Needed if deploying docs requires token access
      issues: write     # MANDATORY: Allows helper script to create issues on failure

    concurrency:
      group: ci-publish
      cancel-in-progress: true

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0 
    
    - name: Install uv and set up Python
      uses: astral-sh/setup-uv@v8.0.0
      with:
        enable-cache: true
        python-version: '3.10'

    - name: Check version and parse bump flag
      id: check_version
      run: |
        uv run python scripts/release_helper.py
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Bump version
      if: steps.check_version.outputs.bump_needed == 'true'
      run: |
        uv version --bump ${{ steps.check_version.outputs.bump_type }}

    - name: Commit new version to main branch and update tag
      if: steps.check_version.outputs.bump_needed == 'true'
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git checkout master
        
        # Commit the native uv updates
        git add pyproject.toml uv.lock
        git commit -m "Bump version to ${{ steps.check_version.outputs.new_version }} and update documentation [skip ci]"
        git push origin master

        # Force update tag to point to the new commit on master
        git tag -f ${{ github.event.release.tag_name }}
        git push origin ${{ github.event.release.tag_name }} --force
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build the package
      run: uv build

    # 4. Optional but recommended: Smoke test the built wheel before publishing
    - name: Smoke test (wheel)
      run: uv run --isolated --no-project --with dist/*.whl python -c "import pyremotedata"

    # 5. Publish with ZERO credentials! uv detects the id-token natively.
    - name: Publish to PyPI
      run: uv publish

    - name: Build Sphinx documentation
      run: |
        cd docs
        uv run --with sphinx --with sphinx_immaterial --with sphinx-autodoc-typehints --with .. make -f Makefile html
        cd ..

    - name: Deploy documentation to gh-pages branch
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: docs/_build/html
        commit_message: "Update documentation for version ${{ steps.check_version.outputs.new_version }} [skip ci]"
        force_orphan: true